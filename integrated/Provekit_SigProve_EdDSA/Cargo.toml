[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
# ── Web framework
axum          = { version = "0.7", features = ["json"] }
tokio         = { version = "1",   features = ["full"] }
serde         = { version = "1",   features = ["derive"] }
serde_json    = "1"
tracing       = "0.1"
tracing-subscriber = "0.3"

# ── Utilities
base64        = "0.22"
uuid          = { version = "1", features = ["v4"] }
hex           = "0.4"
dotenvy       = "0.15"
num_cpus      = "1"
rand          = "0.8"

# ── Baby Jubjub EdDSA scalars
num-bigint    = "0.4"

# ── Poseidon bn254 
light-poseidon = "0.2"
ark-bn254      = "0.4"
ark-ff         = { version = "0.4", features = ["std"] }
