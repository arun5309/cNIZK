[package]
name    = "proofsystem"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proofsystem"
path = "src/main.rs"

[dependencies]
axum       = "0.7"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
base64     = "0.22"
uuid       = { version = "1", features = ["v4"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
dotenvy    = "0.15"
num_cpus   = "1"

[profile.release]
opt-level = 3