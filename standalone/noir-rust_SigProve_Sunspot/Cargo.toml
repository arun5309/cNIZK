[package]
name = "zk-rust-prototype"
version = "0.1.0"
edition = "2021"

[dependencies]
axum      = "0.7"
tokio     = { version = "1", features = ["full"] }
rand      = "0.8"
num-bigint = "0.4"

# Poseidon bn254 (replaces blake2)
light-poseidon = "0.2"
ark-bn254      = "0.4"
ark-ff         = { version = "0.4", features = ["std"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
base64    = "0.22"
dotenvy   = "0.15"
uuid      = { version = "1", features = ["v4"] }
hex       = "0.4"
walkdir   = "2"
num_cpus  = "1"
tracing              = "0.1"
tracing-subscriber   = "0.3"